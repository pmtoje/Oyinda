# Gazelle continuous integration: every push and pull request.
# Typecheck → API tests (real PostgreSQL) → web build → dependency audit → browser suites (journeys, visual
# quality gates in light and dark, session timeout, work queue, interim staff sign-in).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gazelle
          POSTGRES_PASSWORD: gazelle_dev_only   # throwaway CI database only
          POSTGRES_DB: gazelle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gazelle" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (lockfile must be current)
        run: pnpm install --frozen-lockfile

      - name: Create the browser-test database
        run: PGPASSWORD=gazelle_dev_only psql -h localhost -U gazelle -d gazelle_test -c "CREATE DATABASE gazelle_e2e"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and API tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

      - name: Install Playwright Chromium
        run: pnpm --filter @gazelle/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm e2e

      - name: Browser tests — interim staff sign-in mode
        run: pnpm --filter @gazelle/web e2e:local

      - name: Keep screenshots and failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
